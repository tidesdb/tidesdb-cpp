name: TidesDB C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
          - os: macos-latest
            name: macOS x64
          - os: windows-latest
            name: Windows x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout tidesdb-cpp repo
        uses: actions/checkout@v4
        with:
          repository: tidesdb/tidesdb-cpp
          path: tidesdb-cpp

      - name: Checkout tidesdb repo
        uses: actions/checkout@v4
        with:
          repository: tidesdb/tidesdb
          path: tidesdb

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libzstd-dev liblz4-dev libsnappy-dev build-essential cmake pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd lz4 snappy

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-snappy

      - name: Configure and build TidesDB (Linux)
        if: runner.os == 'Linux'
        run: |
          cd tidesdb
          cmake -S . -B build -DTIDESDB_BUILD_TESTS=OFF -DTIDESDB_WITH_SANITIZER=OFF
          cmake --build build --config Release
          sudo cmake --install build
          sudo ldconfig

      - name: Configure and build TidesDB (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tidesdb
          export HOMEBREW_PREFIX=$(brew --prefix)
          cmake -S . -B build \
            -DTIDESDB_BUILD_TESTS=OFF \
            -DTIDESDB_WITH_SANITIZER=OFF \
            -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}"
          cmake --build build --config Release
          sudo cmake --install build

      - name: Create CMake config files for MSYS2 packages (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          MINGW_PREFIX_WIN=$(cygpath -m /mingw64)
          mkdir -p /mingw64/lib/cmake/lz4 /mingw64/lib/cmake/zstd /mingw64/lib/cmake/Snappy /mingw64/lib/cmake/PThreads4W
          echo "if(NOT TARGET lz4::lz4)" > /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "  add_library(lz4::lz4 SHARED IMPORTED)" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "  set_target_properties(lz4::lz4 PROPERTIES" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "    IMPORTED_LOCATION \"${MINGW_PREFIX_WIN}/bin/liblz4.dll\"" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "    IMPORTED_IMPLIB \"${MINGW_PREFIX_WIN}/lib/liblz4.dll.a\"" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "    INTERFACE_INCLUDE_DIRECTORIES \"${MINGW_PREFIX_WIN}/include\")" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "endif()" >> /mingw64/lib/cmake/lz4/lz4-config.cmake
          echo "if(NOT TARGET zstd::libzstd_shared)" > /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "  add_library(zstd::libzstd_shared SHARED IMPORTED)" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "  set_target_properties(zstd::libzstd_shared PROPERTIES" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "    IMPORTED_LOCATION \"${MINGW_PREFIX_WIN}/bin/libzstd.dll\"" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "    IMPORTED_IMPLIB \"${MINGW_PREFIX_WIN}/lib/libzstd.dll.a\"" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "    INTERFACE_INCLUDE_DIRECTORIES \"${MINGW_PREFIX_WIN}/include\")" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "endif()" >> /mingw64/lib/cmake/zstd/zstd-config.cmake
          echo "if(NOT TARGET Snappy::snappy)" > /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "  add_library(Snappy::snappy SHARED IMPORTED)" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "  set_target_properties(Snappy::snappy PROPERTIES" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "    IMPORTED_LOCATION \"${MINGW_PREFIX_WIN}/bin/libsnappy.dll\"" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "    IMPORTED_IMPLIB \"${MINGW_PREFIX_WIN}/lib/libsnappy.dll.a\"" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "    INTERFACE_INCLUDE_DIRECTORIES \"${MINGW_PREFIX_WIN}/include\")" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "endif()" >> /mingw64/lib/cmake/Snappy/Snappy-config.cmake
          echo "if(NOT TARGET PThreads4W::PThreads4W)" > /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "  add_library(PThreads4W::PThreads4W SHARED IMPORTED)" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "  set_target_properties(PThreads4W::PThreads4W PROPERTIES" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "    IMPORTED_LOCATION \"${MINGW_PREFIX_WIN}/bin/libwinpthread-1.dll\"" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "    IMPORTED_IMPLIB \"${MINGW_PREFIX_WIN}/lib/libpthread.dll.a\"" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "    INTERFACE_INCLUDE_DIRECTORIES \"${MINGW_PREFIX_WIN}/include\")" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake
          echo "endif()" >> /mingw64/lib/cmake/PThreads4W/PThreads4W-config.cmake

      - name: Configure and build TidesDB (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tidesdb
          cmake -G "MinGW Makefiles" \
            -DCMAKE_MAKE_PROGRAM=mingw32-make \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DTIDESDB_WITH_SANITIZER=OFF \
            -DTIDESDB_BUILD_TESTS=OFF \
            -S . -B build
          cmake --build build --config Release
          cmake --install build --prefix /mingw64

      - name: Build and test tidesdb-cpp (Linux)
        if: runner.os == 'Linux'
        run: |
          cd tidesdb-cpp
          cmake -S . -B build -DTIDESDB_CPP_BUILD_TESTS=ON
          cmake --build build --config Release
          cd build
          ctest --output-on-failure

      - name: Build and test tidesdb-cpp (macOS)
        if: runner.os == 'macOS'
        run: |
          cd tidesdb-cpp
          export HOMEBREW_PREFIX=$(brew --prefix)
          cmake -S . -B build \
            -DTIDESDB_CPP_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}"
          cmake --build build --config Release
          cd build
          ctest --output-on-failure

      - name: Build and test tidesdb-cpp (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd tidesdb-cpp
          cmake -G "MinGW Makefiles" \
            -DCMAKE_MAKE_PROGRAM=mingw32-make \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DTIDESDB_CPP_BUILD_TESTS=ON \
            -S . -B build
          cmake --build build --config Release
          cd build
          ctest --output-on-failure
